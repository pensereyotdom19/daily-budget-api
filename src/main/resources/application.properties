# Settings for running on your Mac. Production overrides these in application-prod.properties.
spring.application.name=daily-budget-api

# H2 keeps the database in ./data on your Mac. MODE=PostgreSQL makes it behave like production.
spring.datasource.url=jdbc:h2:file:./data/dailybudget;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Flyway creates the tables; Hibernate only checks that the entities match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Errors come back as standard JSON "problem details".
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health

# Key that signs login tokens. This one is only for your Mac; production reads JWT_SECRET.
app.jwt.secret=local-dev-secret-change-me-0123456789abcdef
app.jwt.ttl=P30D
# Anyone can create an account while this is true. Turn it off in production once your account exists.
app.registration-enabled=true
