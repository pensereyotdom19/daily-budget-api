# Used when SPRING_PROFILES_ACTIVE=prod (set in the Dockerfile). Every value comes from the host's
# environment variables, so no password is ever written in the code.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

app.jwt.secret=${JWT_SECRET}
app.registration-enabled=${REGISTRATION_ENABLED:false}

server.port=${PORT:8080}

# Neon's free plan allows a limited number of connections, and one small server needs only a few.
spring.datasource.hikari.maximum-pool-size=5

# Render's proxy passes on the visitor's address and https; trust it only from Render's internal network,
# so the sign-in limits see real addresses and HTTPS-only headers are sent.
server.forward-headers-strategy=native
